# persiana — emergency lockdown configuration.
# Every change to this file is part of the audit trail: its SHA-256 is written into each report.

tenant_id = "<tenant-id>"

[conditional_access]
# Existing policy that blocks guests from a set of external tenants.
# In an emergency persiana widens it to ALL external tenants and makes sure it is enabled.
policy_id = "<ca-policy-id>"   # e.g. "EMERGENCY - Block guests"
# Refuse to run if the policy does not exclude at least this many accounts (break-glass).
min_excluded_users = 1

[sftp]
enabled = true

[service_principals]
enabled = true
# Application permissions (app roles) that count as tenant-wide. Keyed by resource appId.
[service_principals.dangerous_app_roles]
"00000003-0000-0000-c000-000000000000" = [ # Microsoft Graph
  "Directory.ReadWrite.All", "RoleManagement.ReadWrite.Directory", "AppRoleAssignment.ReadWrite.All",
  "Application.ReadWrite.All", "Application.ReadWrite.OwnedBy", "User.ReadWrite.All", "Group.ReadWrite.All",
  "GroupMember.ReadWrite.All", "Policy.ReadWrite.ConditionalAccess", "Policy.ReadWrite.AuthenticationMethod",
  "UserAuthenticationMethod.ReadWrite.All", "Mail.ReadWrite", "Mail.Send", "MailboxSettings.ReadWrite",
  "Files.ReadWrite.All", "Sites.FullControl.All", "Sites.ReadWrite.All", "Domain.ReadWrite.All",
  "PrivilegedAccess.ReadWrite.AzureADGroup", "RoleAssignmentSchedule.ReadWrite.Directory",
  "Directory.Read.All", "Mail.Read", "Files.Read.All", "Sites.Read.All", "User.Read.All",
]
"00000002-0000-0ff1-ce00-000000000000" = ["full_access_as_app", "Exchange.ManageAsApp"]  # Exchange Online
"00000003-0000-0ff1-ce00-000000000000" = ["Sites.FullControl.All", "Sites.ReadWrite.All"] # SharePoint

[service_principals.dangerous_delegated_scopes]
# Delegated scopes consented for ALL users (consentType = AllPrincipals).
"00000003-0000-0000-c000-000000000000" = [
  "Directory.ReadWrite.All", "RoleManagement.ReadWrite.Directory", "Directory.AccessAsUser.All",
  "Application.ReadWrite.All", "User.ReadWrite.All", "Mail.ReadWrite", "Mail.Send",
  "Files.ReadWrite.All", "Sites.FullControl.All", "Policy.ReadWrite.ConditionalAccess",
]

# Read-only permissions are reported with lower severity but still flagged.
[severity]
low = ["Directory.Read.All", "User.Read.All", "Sites.Read.All", "Files.Read.All", "Mail.Read"]

[rbac]
# Azure RBAC roles on a subscription / management group / root scope that flag a service principal.
dangerous_roles = ["Owner", "Contributor", "User Access Administrator", "Role Based Access Control Administrator"]

[app_registrations]
enabled = true

[allowlist]
# NEVER disable these. Microsoft first-party apps are always skipped.
# Add: the identity running persiana, Sentinel playbooks / Logic Apps, Sentinel data connectors, backup tooling.
app_ids = []
service_principal_ids = []
owner_tenant_ids = [
  "f8cdef31-a31e-4b4a-93e4-5f571e91255a", # Microsoft Services
  "72f988bf-86f1-41af-91ab-2d7cd011db47", # Microsoft Corp
]
